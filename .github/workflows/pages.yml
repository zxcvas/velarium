# Amphiteater / Velarium — GitHub Pages from marketing/site only.
# PR: package the static site (regular artifact). No configure-pages / deploy.
# Push to master / workflow_dispatch: configure-pages + deploy (after Pages is enabled).
# BRIEF.md lives at marketing/BRIEF.md and is not in this folder.

name: Deploy marketing site

on:
  push:
    branches: [master]
    paths:
      - "marketing/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "marketing/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    name: Package site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard site folder
        run: |
          set -euo pipefail
          test -f marketing/site/index.html
          test -f marketing/site/styles.css
          test -d marketing/site/img
          if [[ -e marketing/site/BRIEF.md ]]; then
            echo "BRIEF.md must stay at marketing/BRIEF.md, not inside site/" >&2
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-site
          path: marketing/site

  deploy:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
