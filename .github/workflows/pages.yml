# Amphiteater / Velarium — GitHub Pages from marketing/site only.
# Sibling simplicity: FOON web/site pages.yml, Latifundium marketing/site allowlist.
# BRIEF.md lives at marketing/BRIEF.md and is not in this folder.

name: Deploy marketing site

on:
  push:
    branches: [master]
    paths:
      - "marketing/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "marketing/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard site folder
        run: |
          set -euo pipefail
          test -f marketing/site/index.html
          test -f marketing/site/styles.css
          test -d marketing/site/img
          if [[ -e marketing/site/BRIEF.md ]]; then
            echo "BRIEF.md must stay at marketing/BRIEF.md, not inside site/" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
